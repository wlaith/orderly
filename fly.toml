app = "orderly-line"
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  BASE_URL = "https://orderly.laithwazani.com"
  TRUST_PROXY = "1"
  LITESTREAM_ENDPOINT = "https://fly.storage.tigris.dev"

[deploy]
  strategy = "immediate"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
